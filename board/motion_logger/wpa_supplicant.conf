# Мережі Wi-Fi для Motion Logger. Файл лежить на розділі boot (FAT): правиться на будь-якому
# комп'ютері через кард-рідер (зміни діють після перезавантаження плати) або на самій платі:
#   wifi add "Назва мережі"      (спитає пароль), wifi list, wifi remove "Назва мережі"
# Поки тут нема жодного блоку network={...}, Wi-Fi на платі не вмикається.
#
# Мережа з паролем (8..63 символи, у лапках відкритим текстом; команда wifi пише замість нього ключ psk=...):
#network={
#	ssid="MyNetwork"
#	psk="my password"
#}
# Кілька мереж: кілька блоків; priority=N у блоці (більше число = пробувати раніше).
# Відкрита мережа: key_mgmt=NONE замість psk. Прихована мережа: додати scan_ssid=1.
ctrl_interface=/var/run/wpa_supplicant
country=UA
