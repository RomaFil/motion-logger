# Модулі ядра, які вантажить S11modules під час старту. Ядро зібрано з цими драйверами як модулями
# (=m), а автоматичного підвантаження за device tree (udev/mdev) в образі нема, тому перелічуємо явно.
# I2C1 (RP1, Designware) і /dev/i2c-N
i2c-designware-platform
i2c-dev
# SPI0 (RP1, Designware) і /dev/spidevB.C
spi-dw-mmio
spidev
# Драйвери датчиків (IIO): MPU6050 на I2C і ADXL345 на SPI. Ім'я inv-mpu6050-i2c є в modules.dep збірки;
# adxl345_spi з'явиться після linux.fragment. На платі не перевірено.
inv-mpu6050-i2c
adxl345_spi
# Wi-Fi Pi 5 (чип CYW43455 на SDIO): brcmfmac тягне за собою cfg80211, rfkill і brcmutil; прошивку бере
# з /lib/firmware/brcm (пакет linux-firmware). Ядро 6.12 розділило драйвер на ядро brcmfmac і вендорні
# модулі (wcc для Broadcom, cyw для Cypress), потрібний вибирається за чипом. На платі не перевірено.
brcmfmac-wcc
brcmfmac-cyw
brcmfmac
