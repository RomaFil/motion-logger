# brcmfmac на Pi 5 (чип CYW43455):
# - roamoff=1: роумінг робить wpa_supplicant, а не прошивка чипа;
# - feature_disable=0x82000: вимикає апаратну (прошивкову) 4-way handshake. wpa_supplicant 2.11+ після
#   асоціації чекає від драйвера "port authorized", brcmfmac його не шле, і через 10 с wpa_supplicant сам
#   розриває з'єднання (Authentication timed out, CONN_FAILED). Відомий збій wpa_supplicant 2.11+ з brcmfmac:
#   https://lists.infradead.org/pipermail/hostap/2024-August/042893.html. Без офлоаду handshake робить
#   wpa_supplicant, як у WPA2 звичайно.
options brcmfmac roamoff=1 feature_disable=0x82000
